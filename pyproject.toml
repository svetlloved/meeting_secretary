[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-secretary"
version = "0.1.0"
description = "Telegram bot for meeting transcription and post-meet summaries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot==21.10",
    "faster-whisper==1.1.1",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "requests>=2.31.0",
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
]

[project.scripts]
meeting-secretary = "meeting_secretary.server:main"
meeting-secretary-bot = "meeting_secretary.bot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meeting_secretary*"]
